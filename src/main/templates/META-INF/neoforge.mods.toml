modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Sablednah/WadCraft/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# Artwork, declared three ways as in LegendQuest; older loaders ignore keys they do not know.
#   iconFile   - the small square beside the name in the list (26.2+)
#   bannerFile - the wide image in the info panel (26.2+)
#   logoFile   - what 1.21.x and 26.1 show, and 26.2's fallback
# Cut from the originals in art/ with their black backgrounds cleared. Smoothed,
# because this is detailed artwork scaled down, and point sampling shreds it.
iconFile="wadcraft-icon.png"
bannerFile="wadcraft.png"
logoFile="wadcraft.png"
logoBlur=true
iconBlur=true
authors="${mod_authors}"
description='''
${mod_description}
'''
displayURL="https://github.com/Sablednah/WadCraft"

# Server-side only: nothing for a client to install, and a vanilla client sees
# every block it places. Do not fail a connection over this mod's presence.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
